<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No TV Signal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        
        .tv-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #000 0%, #111 100%);
            display: flex;
            flex-direction: column;
            color: #fff;
        }
        
        .color-bars {
            width: 100%;
            height: 75%;
            display: flex;
        }
        
        .color-bar {
            flex: 1;
            height: 100%;
        }
        
        .grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
        }
        
        .center-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 100%;
        }
        
        .no-signal {
            font-size: 6vw;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
            animation: pulse 2s infinite;
            font-weight: bold;
            letter-spacing: 3px;
        }
        
        .footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
            padding: 2vh 0;
        }
        
        .date-time {
            color: #fff;
            font-size: 2.5vh;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.7);
            margin-bottom: 2vh;
            line-height: 1.4;
        }
        
        .standby-text {
            font-size: 3vh;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
            animation: flicker 3s infinite;
            letter-spacing: 1px;
        }
        
        .scan-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 0, 0, 0.1) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 5;
        }
        
        .static {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            opacity: 0.05;
            pointer-events: none;
            z-index: 6;
        }
        
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* CRT effect */
        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            z-index: 7;
            pointer-events: none;
        }
        
        .crt::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: rgba(18, 16, 16, 0.1);
            opacity: 0;
            z-index: 8;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }
        
        /* Responsive adjustments for very small screens */
        @media (max-width: 768px) {
            .no-signal {
                font-size: 8vw;
                letter-spacing: 2px;
            }
            
            .date-time {
                font-size: 2vh;
            }
            
            .standby-text {
                font-size: 2.5vh;
            }
        }
        
        @media (max-width: 480px) {
            .no-signal {
                font-size: 10vw;
                letter-spacing: 1px;
            }
            
            .date-time {
                font-size: 1.8vh;
            }
            
            .standby-text {
                font-size: 2.2vh;
            }
        }
    </style>
</head>
<body>
    <div class="tv-container">
        <div class="screen crt">
            <div class="color-bars">
                <div class="color-bar" style="background-color: #ffffff;"></div>
                <div class="color-bar" style="background-color: #ffff00;"></div>
                <div class="color-bar" style="background-color: #00ffff;"></div>
                <div class="color-bar" style="background-color: #00ff00;"></div>
                <div class="color-bar" style="background-color: #ff00ff;"></div>
                <div class="color-bar" style="background-color: #ff0000;"></div>
                <div class="color-bar" style="background-color: #0000ff;"></div>
                <div class="color-bar" style="background-color: #000000;"></div>
            </div>
            <div class="grid"></div>
            <div class="center-container">
                <div class="no-signal">NO SIGNAL</div>
            </div>
            <div class="footer">
                <div class="date-time" id="date-time">Loading...</div>
                <div class="standby-text">STANDBY FOR TRANSMISSION</div>
            </div>
            <div class="scan-lines"></div>
            <div class="static" id="static"></div>
        </div>
    </div>

    <script>
        // Create static effect
        function createStatic() {
            const staticElement = document.getElementById('static');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Use current screen dimensions
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Fill with random noise
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                const value = Math.random() * 255;
                data[i] = value;     // R
                data[i + 1] = value; // G
                data[i + 2] = value; // B
                data[i + 3] = 10;    // A (low opacity)
            }
            
            ctx.putImageData(imageData, 0, 0);
            staticElement.style.backgroundImage = `url(${canvas.toDataURL()})`;
        }
        
        // Initialize static effect
        createStatic();
        
        // Update static effect when window resizes
        window.addEventListener('resize', createStatic);
        
        // Update static effect periodically
        setInterval(createStatic, 100);
        
        // Update date and time
        function updateDateTime() {
            const now = new Date();
            const dateTimeElement = document.getElementById('date-time');
            
            // Format date as "Weekday, Month Day, Year"
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            };
            const dateString = now.toLocaleDateString(undefined, options);
            
            // Format time as "HH:MM:SS"
            const timeString = now.toLocaleTimeString();
            
            // Format timezone
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            
            dateTimeElement.innerHTML = `${dateString}<br>${timeString}<br>${timezone}`;
        }
        
        // Update date and time every second
        updateDateTime();
        setInterval(updateDateTime, 1000);
    </script>
</body>
</html>
